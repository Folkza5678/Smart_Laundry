<script>
  function checkGlobalBookingTimer() {
    const expiresAt = localStorage.getItem('booking_expires_at');
    if (!expiresAt) return;

    if (Date.now() >= parseInt(expiresAt)) {
      localStorage.removeItem('booking_expires_at');
      Swal.fire({
        icon: 'warning',
        title: 'หมดเวลาการจอง!',
        text: 'รายการจองของคุณหมดเวลาชำระเงิน (10 นาที) ระบบได้คืนคิวแล้ว กรุณาทำรายการใหม่อีกครั้ง',
        confirmButtonText: 'ตกลง / ไปหน้าจอง',
        confirmButtonColor: '#00036C',
        allowOutsideClick: false,
        allowEscapeKey: false
      }).then(() => {
        window.location.href = 'booking.html';
      });
    }
  }
  setInterval(checkGlobalBookingTimer, 1000);
  document.addEventListener('DOMContentLoaded', checkGlobalBookingTimer);
</script>
