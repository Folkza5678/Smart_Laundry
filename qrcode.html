<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Laundry - สแกนตู้ซักผ้า</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ABeeZee&family=Afacad+Flux:wght@400;500;600;700&family=Inter:ital,wght@0,400;0,500;0,600;0,900;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template/qrcode.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="global-notify.js"></script>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="images/logols.png" alt="Smart Laundry Logo" class="logo">
      <div class="brand-text">
        <span class="brand-en">Smart Laundry</span>
        <span class="brand-th">สมาร์ท ลอนดรี</span>
      </div>
    </a>

    <nav class="nav-menu">
      <a href="index.html" class="nav-item"><span class="nav-label">Home</span></a>
      <a href="booking.html" class="nav-item"><span class="nav-label">Booking</span></a>
      <a href="history1.html" class="nav-item"><span class="nav-label">History</span></a>
      <a href="qrcode.html" class="nav-item nav-item-qr active"><span class="nav-label">QR Code</span></a>
      <a href="about.html" class="nav-item"><span class="nav-label">About</span></a>
      <a href="howtouse.html" class="nav-item"><span class="nav-label">How to use</span></a>
      <a href="profile.html" class="nav-item"><span class="nav-label">Profile</span></a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">สแกนตู้ซักผ้า</h1>

    <div id="scan-stage" class="stage-card">
      <div class="selected-program-bar">
        <div class="program-info">
          <span class="program-label">รายการที่เลือกไว้:</span>
          <span class="program-detail" id="program-detail">กำลังโหลด...</span>
        </div>
        <div class="program-price" id="program-price">-</div>
      </div>

      <div class="scanner-wrapper">
        <div class="scanner-box">
          <video id="webcam-preview" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>
          <div class="scan-line"></div>
          <p class="scanner-tip">สแกน QR Code ที่ติดอยู่บนตู้ซักผ้า</p>
        </div>
      </div>

      <div class="manual-input-section">
        <p class="manual-title">สแกนไม่ติด? กรอกรหัสตู้หน้าร้านได้ที่นี่</p>
        <div class="input-group">
          <input type="text" id="machine-id-input" placeholder="เช่น M-01, M-02 หรือเลขตู้ 1" value="">
          <button class="btn-primary" onclick="proceedToCheckin()">ยืนยันตู้</button>
        </div>
      </div>

      <div class="demo-trigger">
        <button class="btn-demo" onclick="simulateScan()">⚡ จำลองการสแกนตู้สำเร็จ</button>
      </div>
    </div>
  </main>

  <script>
    let videoStream = null, pendingMachine = null, isScanning = false;
    const canvasElement = document.createElement("canvas");
    const canvasContext = canvasElement.getContext("2d");

    function parseMachineCode(text) {
      if (!text) return '';
      let str = text.trim();
      
      // 📌 แปลงลิงก์ย่อหน้าตู้ https://qrco.de/bh4hgQ เป็น M-01
      if (str.toLowerCase().includes('qrco.de/bh4hgq')) {
        return 'M-01';
      }

      if (str.includes('?')) {
        try {
          const urlObj = new URL(str.startsWith('http') ? str : 'http://dummy/' + str);
          const param = urlObj.searchParams.get('code') || urlObj.searchParams.get('machine_id');
          if (param) str = param;
        } catch (e) {}
      }
      
      const match = str.match(/(?:M|MACHINE|ตู้|เครื่อง)[-_\s]?(\d{1,2})\b/i);
      if (match) {
        const num = parseInt(match[1], 10);
        if (num >= 1 && num <= 99) return `M-${num < 10 ? '0' + num : num}`;
      }

      const cleanUrl = str.replace(/^https?:\/\/[^\/]+/, '');
      const nums = cleanUrl.match(/\b\d{1,2}\b/g);
      if (nums && nums.length > 0) {
        const lastNum = parseInt(nums[nums.length - 1], 10);
        if (lastNum >= 1 && lastNum <= 99) return `M-${lastNum < 10 ? '0' + lastNum : lastNum}`;
      }
      
      if (/^\d{1,2}$/.test(str)) {
        const num = parseInt(str, 10);
        if (num >= 1 && num <= 99) return `M-${num < 10 ? '0' + num : num}`;
      }
      return str;
    }

    async function loadPendingBooking() {
      const res = await fetch('/api/bookings/pending');
      if (res.ok) {
        const data = await res.json();
        const b = data.booking;
        pendingMachine = b ? b.machine_code : null;
        document.getElementById('program-detail').textContent = b
          ? 'เครื่อง ' + b.machine_code + ' (' + b.capacity_kg + ' kg) | ' + b.program
          : 'ยังไม่มีรายการจอง — กรุณาไปที่หน้า Booking ก่อน';
        document.getElementById('program-price').textContent = b ? b.price + ' บาท' : '-';
      }
    }

    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      } catch (err) { 
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
        } catch (err2) { return; }
      }

      const video = document.getElementById('webcam-preview');
      if (video) {
        video.srcObject = videoStream;
        video.setAttribute("playsinline", true);
        await video.play();
        isScanning = true;
        requestAnimationFrame(scanQRCodeTick);
      }
    }

    function scanQRCodeTick() {
      if (!isScanning) return;
      const video = document.getElementById('webcam-preview');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvasElement.height = video.videoHeight;
        canvasElement.width = video.videoWidth;
        canvasContext.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
        
        const imageData = canvasContext.getImageData(0, 0, canvasElement.width, canvasElement.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

        if (code && code.data) {
          const cleanCode = parseMachineCode(code.data);
          document.getElementById('machine-id-input').value = cleanCode;
          isScanning = false;
          proceedToCheckin();
          return;
        }
      }

      if (isScanning) requestAnimationFrame(scanQRCodeTick);
    }

    function simulateScan() {
      if (pendingMachine) {
        document.getElementById('machine-id-input').value = parseMachineCode(pendingMachine);
      }
      proceedToCheckin();
    }

    function proceedToCheckin() {
      const rawInput = document.getElementById('machine-id-input').value.trim();
      const code = parseMachineCode(rawInput);

      if (!code) { 
        Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสตู้ซักผ้าหน้าร้าน', confirmButtonColor: '#00036C' });
        return; 
      }
      
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
      }
      
      // 📌 เมื่อสแกนผ่าน ส่งต่อไปยังหน้ายืนยันตู้confirm-checkin.html
      window.location.href = `confirm-checkin.html?code=${encodeURIComponent(code)}`;
    }

    window.addEventListener('DOMContentLoaded', () => { loadPendingBooking(); startCamera(); });
  </script>
  <!-- 📌 สคริปต์ตรวจจับและแจ้งเตือนสถานะ (วางก่อนปิด </body>) -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    (function () {
      let activeCheckInterval = null;

      // 1. ตรวจสอบสถานะการซักเบื้องหลังทุกๆ 3 วินาที
      async function checkActiveStatus() {
        try {
          const res = await fetch('/api/user/active-status');
          if (!res.ok) return;
          const data = await res.json();

          // 📌 ถ้ากำลังซักอยู่ หรือเพิ่งซักเสร็จ ให้ลบเวลาจองทิ้งทันที! (กันเด้งหมดเวลาจองแทรก)
          if (data.has_active && (data.status === 'washing' || data.status === 'just_completed')) {
            localStorage.removeItem('booking_expires_at');
          }

          // 📌 ถ้าซักเสร็จแล้ว (status = 'just_completed')
          if (data.has_active && data.status === 'just_completed') {
            const notifiedKey = 'notified_completed_' + data.booking_id;

            // ตรวจว่ารายการนี้เคยเด้ง Popup ใน Session นี้ไปแล้วหรือยัง
            if (!sessionStorage.getItem(notifiedKey)) {
              sessionStorage.setItem(notifiedKey, 'true');
              localStorage.removeItem('booking_expires_at');

              Swal.fire({
                icon: 'success',
                title: '🧺 ผ้าซักเสร็จเรียบร้อยแล้ว!',
                text: `ผ้าของคุณที่ตู้ ${data.machine_name || ''} (${data.machine_code || ''}) ซักเสร็จเรียบร้อยแล้ว กรุณามารับผ้าด้วยครับ`,
                confirmButtonText: 'ไปที่หน้าประวัติ',
                confirmButtonColor: '#00036C',
                allowOutsideClick: false
              }).then((result) => {
                if (result.isConfirmed) {
                  window.location.href = 'history1.html';
                }
              });
            }
          }
        } catch (e) {
          console.error('Error checking active status:', e);
        }
      }

      // 2. ตรวจสอบหมดเวลาจองค้าง
      function checkBookingTimer() {
        const expiresAt = localStorage.getItem('booking_expires_at');
        if (!expiresAt) return;

        if (Date.now() >= parseInt(expiresAt)) {
          localStorage.removeItem('booking_expires_at');
          Swal.fire({
            icon: 'warning',
            title: 'หมดเวลาการจอง!',
            text: 'รายการจองของคุณหมดเวลาชำระเงิน ระบบได้คืนคิวแล้ว กรุณาทำรายการใหม่อีกครั้ง',
            confirmButtonText: 'ตกลง / ไปหน้าจอง',
            confirmButtonColor: '#00036C',
            allowOutsideClick: false,
            allowEscapeKey: false
          }).then(() => {
            window.location.href = 'booking.html';
          });
        }
      }

      // เริ่มทำงานทันทีเมื่อโหลดหน้าเว็บ
      checkActiveStatus();
      checkBookingTimer();
      setInterval(checkActiveStatus, 3000);
      setInterval(checkBookingTimer, 1000);
    })();
  </script>
</body>
</html>
