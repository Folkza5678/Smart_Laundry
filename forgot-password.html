<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Laundry - ลืมรหัสผ่าน</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@400;500;600;700&family=Hanuman:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- ลิงก์ CSS -->
  <link rel="stylesheet" href="template/booking.css">
  <link rel="stylesheet" href="template/login.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="global-notify.js"></script>

  <!-- สไตล์จัดรูปแบบให้ตรงกับหน้า Login/Register 100% -->
  <style>
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px 50px;
    }
    .login-main-title {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      color: #1e3a8a;
      margin: 15px 0 25px;
      font-family: 'Hanuman', serif;
      letter-spacing: 1.5px;
    }
    .login-box {
      display: flex !important;
      flex-direction: row !important;
      width: 100%;
      max-width: 850px;
      min-height: 450px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .login-brand-side {
      flex: 1 !important;
      width: 45% !important;
      background: #1890ff !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 40px 25px !important;
    }
    .brand-logo-wrapper {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      color: #ffffff;
    }
    .brand-logo-img {
      width: 80px;
      height: auto;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .brand-divider {
      width: 2px;
      height: 60px;
      background-color: rgba(255, 255, 255, 0.8);
      margin: 0 18px;
    }
    .brand-text-content {
      display: flex;
      flex-direction: column;
    }
    .brand-title-en {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .brand-title-th {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 4px;
    }
    .login-form-side {
      flex: 1.2 !important;
      width: 55% !important;
      background: #f8fafc !important;
      padding: 40px 45px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
    }
    .form-title {
      font-family: 'Hanuman', serif !important;
      font-size: 34px !important;
      font-weight: 800 !important;
      color: #1e293b !important;
      text-align: center !important;
      margin-bottom: 6px !important;
    }
    .login-form label {
      font-weight: 600;
      font-size: 14px;
      color: #334155;
      margin-bottom: 6px;
      display: block;
    }
    .login-form input {
      width: 100%;
      border-radius: 20px !important;
      padding: 10px 18px !important;
      border: 1px solid #cbd5e1 !important;
      outline: none !important;
      box-sizing: border-box;
      font-size: 14px;
      background: #ffffff;
    }
    .login-form input:focus {
      border-color: #2196f3 !important;
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.15) !important;
    }
    .btn-primary {
      background: #2196f3 !important;
      border-radius: 20px !important;
      height: 42px !important;
      font-weight: 600 !important;
      font-size: 15px !important;
      color: #fff !important;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #1976d2 !important;
    }
  </style>
</head>
<body class="page-login">

  <!-- Header / Navbar -->
  <header class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="images/logols.png" alt="Smart Laundry Logo" class="logo">
      <div class="brand-text">
        <span class="brand-en">Smart Laundry</span>
        <span class="brand-th">สมาร์ท ลอนดรี</span>
      </div>
    </a>

    <nav class="nav-menu">
      <a href="index.html" class="nav-item">
        <img src="images/home.png" alt="" class="nav-icon">
        <span>Home</span>
      </a>
      <a href="booking.html" class="nav-item">
        <img src="images/washing-machine.png" alt="" class="nav-icon">
        <span>Booking</span>
      </a>
      <a href="history.html" class="nav-item">
        <img src="images/history.png" alt="" class="nav-icon">
        <span>History</span>
      </a>
      <a href="qrcode.html" class="nav-item">
        <img src="images/qr-code.png" alt="" class="nav-icon">
        <span>QR Code</span>
      </a>
      <a href="about.html" class="nav-item">
        <img src="images/information.png" alt="" class="nav-icon">
        <span>About</span>
      </a>
      <a href="howtouse.html" class="nav-item">
        <img src="images/open-book.png" alt="" class="nav-icon">
        <span>How to use</span>
      </a>
      <a href="profile.html" class="nav-item">
        <img src="images/user.png" alt="" class="nav-icon">
        <span>Profile</span>
      </a>
    </nav>
  </header>

  <main class="login-container">
    <!-- หัวข้อใหญ่ด้านบนกล่อง -->
    <h1 class="login-main-title">SMART LAUNDRY</h1>

    <div class="login-box">

      <!-- ฝั่งซ้าย: แถบสีฟ้าพร้อมโลโก้สีขาว -->
      <div class="login-brand-side">
        <div class="brand-logo-wrapper">
          <img src="images/logols.png" alt="Smart Laundry Logo" class="brand-logo-img">
          <div class="brand-divider"></div>
          <div class="brand-text-content">
            <span class="brand-title-en">Smart Laundry</span>
            <span class="brand-title-th">สมาร์ท ลอนดรี</span>
          </div>
        </div>
      </div>

      <!-- ฝั่งขวา: ฟอร์มรีเซ็ตรหัสผ่าน -->
      <div class="login-form-side">
        <h2 class="form-title" id="form-title">Reset Password</h2>
        <p id="form-desc" style="font-size: 13px; color: #64748b; margin-bottom: 20px; text-align: center;">กรอกอีเมลของคุณเพื่อรับรหัส OTP ยืนยันตัวตน</p>

        {% include "_flash.html" %}
        
        <form class="login-form" id="resetPasswordForm" onsubmit="return false;">
          
          <!-- ขั้นตอนที่ 1: กรอกอีเมลเพื่อขอ OTP -->
          <div id="step-1" class="form-step">
            <div class="form-group" style="margin-bottom: 16px;">
              <label for="email">อีเมลที่ใช้สมัครสมาชิก <span class="required" style="color:red;">*</span></label>
              <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>
            <button type="button" id="btn-send-otp" class="btn btn-primary" style="width:100%;border:none;cursor:pointer;margin:10px 0 16px;">ส่งรหัส OTP ไปที่ Gmail</button>
          </div>

          <!-- ขั้นตอนที่ 2: กรอกรหัส OTP -->
          <div id="step-2" class="form-step" style="display: none;">
            <div class="form-group" style="margin-bottom: 8px;">
              <label for="otp">รหัส OTP (6 หลัก) <span class="required" style="color:red;">*</span></label>
              <input type="text" id="otp" name="otp" placeholder="กรอกรหัส OTP 6 หลัก" maxlength="6" style="letter-spacing: 4px; text-align: center; font-size: 18px; font-weight: bold;">
            </div>
            <button type="button" id="btn-verify-otp" class="btn btn-primary" style="width:100%;border:none;cursor:pointer;margin:12px 0 8px;">ยืนยัน OTP</button>
            <div style="text-align: right; margin-bottom: 16px;">
              <a href="#" id="btn-resend-otp" style="font-size: 13px; color: #007bff; text-decoration: none;">ส่งรหัส OTP อีกครั้ง</a>
            </div>
          </div>

          <!-- ขั้นตอนที่ 3: ตั้งรหัสผ่านใหม่ -->
          <div id="step-3" class="form-step" style="display: none;">
            <div class="form-group" style="margin-bottom: 12px;">
              <label for="new_password">รหัสผ่านใหม่ <span class="required" style="color:red;">*</span></label>
              <input type="password" id="new_password" name="new_password" placeholder="อย่างน้อย 6 ตัวอักษร">
            </div>
            <div class="form-group" style="margin-bottom: 16px;">
              <label for="confirm_password">ยืนยันรหัสผ่านใหม่ <span class="required" style="color:red;">*</span></label>
              <input type="password" id="confirm_password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง">
            </div>
            <button type="button" id="btn-reset-password" class="btn btn-primary" style="width:100%;border:none;cursor:pointer;margin:8px 0 16px;">ตั้งรหัสผ่านใหม่</button>
          </div>

          <div class="form-footer-links" style="text-align: center;">
            <a href="login.html" class="register-link" style="font-size: 13px; color: #64748b; text-decoration: none; font-weight: 500;">← กลับไปหน้าเข้าสู่ระบบ</a>
          </div>

        </form>
      </div>

    </div>
  </main>

  <!-- Script จัดการเปลี่ยน Step และยิง APIs -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const step1 = document.getElementById('step-1');
      const step2 = document.getElementById('step-2');
      const step3 = document.getElementById('step-3');

      const emailInput = document.getElementById('email');
      const otpInput = document.getElementById('otp');
      const newPasswordInput = document.getElementById('new_password');
      const confirmPasswordInput = document.getElementById('confirm_password');

      const formTitle = document.getElementById('form-title');
      const formDesc = document.getElementById('form-desc');

      const btnSendOtp = document.getElementById('btn-send-otp');
      const btnVerifyOtp = document.getElementById('btn-verify-otp');
      const btnResendOtp = document.getElementById('btn-resend-otp');
      const btnResetPassword = document.getElementById('btn-reset-password');

      let resetToken = '';

      async function sendRequest(url, data) {
        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          const result = await response.json();
          return { httpOk: response.ok, ...result };
        } catch (e) {
          return { httpOk: false, error: 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้' };
        }
      }

      async function handleSendOtp() {
        const email = emailInput.value.trim();
        if (!email) {
          Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกอีเมล' });
          return;
        }

        Swal.fire({ title: 'กำลังส่ง OTP...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        
        const res = await sendRequest('/api/auth/send-reset-otp', { email });
        
        if (res.httpOk && res.ok) {
          Swal.fire({
            icon: 'success',
            title: 'ส่ง OTP เรียบร้อย',
            text: res.message || 'โปรดตรวจสอบรหัส OTP ใน Gmail ของคุณ',
            timer: 1800,
            showConfirmButton: false
          });
          
          step1.style.display = 'none';
          step2.style.display = 'block';
          formTitle.innerText = 'ยืนยันรหัส OTP';
          formDesc.innerText = `กรอกรหัส OTP 6 หลักที่ได้รับในอีเมล ${email}`;
        } else {
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: res.error || res.message || 'ไม่พบอีเมลนี้ในระบบ หรือเกิดข้อผิดพลาด'
          });
        }
      }

      btnSendOtp.addEventListener('click', handleSendOtp);
      btnResendOtp.addEventListener('click', (e) => {
        e.preventDefault();
        handleSendOtp();
      });

      btnVerifyOtp.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const otp = otpInput.value.trim();

        if (!otp) {
          Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัส OTP' });
          return;
        }

        Swal.fire({ title: 'กำลังตรวจสอบ OTP...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const res = await sendRequest('/api/auth/verify-reset-otp', { email, otp });

        if (res.httpOk && res.ok) {
          resetToken = res.reset_token;

          Swal.fire({
            icon: 'success',
            title: 'ยืนยัน OTP สำเร็จ',
            text: 'กรุณากำหนดรหัสผ่านใหม่',
            timer: 1500,
            showConfirmButton: false
          });

          step2.style.display = 'none';
          step3.style.display = 'block';
          formTitle.innerText = 'ตั้งรหัสผ่านใหม่';
          formDesc.innerText = 'กรุณากำหนดรหัสผ่านใหม่สำหรับการเข้าสู่ระบบ';
        } else {
          Swal.fire({
            icon: 'error',
            title: 'OTP ไม่ถูกต้อง',
            text: res.error || res.message || 'รหัส OTP ไม่ถูกต้องหรือหมดอายุ'
          });
        }
      });

      btnResetPassword.addEventListener('click', async () => {
        const email = emailInput.value.trim();
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!newPassword) {
          Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกรหัสผ่านใหม่' });
          return;
        }
        if (newPassword !== confirmPassword) {
          Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'รหัสผ่านใหม่และการยืนยันรหัสผ่านไม่ตรงกัน' });
          return;
        }

        Swal.fire({ title: 'กำลังบันทึกรหัสผ่านใหม่...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const res = await sendRequest('/api/auth/reset-password', {
          email: email,
          reset_token: resetToken,
          new_password: newPassword,
          confirm_password: confirmPassword
        });

        if (res.httpOk && res.ok) {
          Swal.fire({
            icon: 'success',
            title: 'เปลี่ยนรหัสผ่านสำเร็จ!',
            text: 'กำลังนำคุณไปยังหน้าเข้าสู่ระบบ...',
            timer: 2000,
            showConfirmButton: false
          }).then(() => {
            window.location.href = 'login.html';
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'เปลี่ยนรหัสผ่านไม่สำเร็จ',
            text: res.error || res.message || 'เกิดข้อผิดพลาด โปรดลองอีกครั้ง'
          });
        }
      });
    });
  </script>

</body>
</html>
