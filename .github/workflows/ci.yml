name: Smart Laundry CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Lint and Syntax Check
      run: |
        python -m py_compile app.py
        
    - name: Trigger Render Deploy (CD)
      run: |
        curl -X POST "https://api.render.com/deploy/srv-dbpbvpm1egvs73bmuqhg?key=loSgbvEbcV4"